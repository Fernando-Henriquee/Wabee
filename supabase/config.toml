# Configuração do projeto Supabase (Supabase CLI: `supabase link`, `supabase db push`).
# As migrations também podem ser aplicadas com `npm run db:migrate` (docs/SUPABASE.md).
project_id = "wabee"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/redefinir-senha"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Cadastro aberto (tela "Criar conta"): cada conta cria a própria empresa e só entra em outra por convite.
# A confirmação de e-mail abaixo precisa continuar ligada (convites são entregues pelo e-mail da conta).
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

[storage]
enabled = true
file_size_limit = "25MiB"

# Convite de pessoas para uma empresa (precisa do secret SITE_URL: docs/SUPABASE.md).
[functions.invite-member]
enabled = true
verify_jwt = true
entrypoint = "./functions/invite-member/index.ts"
